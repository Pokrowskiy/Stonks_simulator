<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Simulator Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #334155;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .status {
            display: flex;
            gap: 20px;
            justify-content: center;
            font-size: 14px;
        }

        .status-item {
            padding: 8px 16px;
            border-radius: 4px;
            background: #1e293b;
        }

        .status-item.connected {
            background: #166534;
            color: #86efac;
        }

        .status-item.disconnected {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
        }

        .card-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .card-change {
            font-size: 12px;
            color: #94a3b8;
        }

        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .price-item {
            background: #0f172a;
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid #3b82f6;
        }

        .price-ticker {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .price-value {
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }

        .ticker-log {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Monaco', monospace;
            font-size: 12px;
        }

        .log-item {
            padding: 5px 0;
            border-bottom: 1px solid #334155;
            color: #cbd5e1;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-tick {
            color: #60a5fa;
            font-weight: bold;
        }

        .log-time {
            color: #94a3b8;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            margin-bottom: 20px;
        }

        button:hover {
            background: #2563eb;
        }

        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Trading Simulator</h1>
            <div class="status">
                <div class="status-item" id="connectionStatus">
                    🔴 Отключено
                </div>
                <div class="status-item">
                    Тик: <span id="tickCount">0</span>
                </div>
                <div class="status-item">
                    Индекс: <span id="indexPrice">0.00</span>
                </div>
            </div>
        </header>

        <div>
            <button onclick="connectWebSocket()">Подключиться</button>
            <button onclick="disconnectWebSocket()">Отключиться</button>
            <button onclick="clearLog()">Очистить лог</button>
        </div>

        <div class="grid">
            <div class="card">
                <div class="card-title">Текущий тик</div>
                <div class="card-value" id="currentTick">0</div>
            </div>

            <div class="card">
                <div class="card-title">Цена индекса</div>
                <div class="card-value" id="currentIndex">0.00</div>
            </div>

            <div class="card">
                <div class="card-title">Активных подключений</div>
                <div class="card-value" id="connections">0</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Цены компаний</div>
            <div class="price-grid" id="priceGrid">
                <div class="price-item">
                    <div class="price-ticker">Загружение...</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Лог обновлений</div>
            <div class="ticker-log" id="tickerLog">
                <div class="log-item">Ожидание подключения...</div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;

        function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                console.log("Уже подключено");
                return;
            }

            ws = new WebSocket("ws://localhost:8020/ws");

            ws.onopen = () => {
                console.log("✓ WebSocket подключено");
                updateConnectionStatus(true);
                addLog("✓ Подключено к серверу");
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                updateDashboard(data);
            };

            ws.onerror = (error) => {
                console.error("WebSocket ошибка:", error);
                addLog("✗ Ошибка подключения");
            };

            ws.onclose = () => {
                console.log("WebSocket закрыто");
                updateConnectionStatus(false);
                addLog("✗ Отключено от сервера");
            };
        }

        function disconnectWebSocket() {
            if (ws) {
                ws.close();
            }
        }

        function updateConnectionStatus(connected) {
            const status = document.getElementById("connectionStatus");
            if (connected) {
                status.className = "status-item connected";
                status.textContent = "🟢 Подключено";
            } else {
                status.className = "status-item disconnected";
                status.textContent = "🔴 Отключено";
            }
        }

        function updateDashboard(data) {
            // Обновляем тик
            if (data.tick) {
                document.getElementById("tickCount").textContent = data.tick;
                document.getElementById("currentTick").textContent = data.tick;
            }

            // Обновляем индекс
            if (data.index_price) {
                const indexStr = data.index_price.toFixed(2);
                document.getElementById("indexPrice").textContent = indexStr;
                document.getElementById("currentIndex").textContent = indexStr;
            }

            // Обновляем цены
            if (data.prices) {
                updatePrices(data.prices);
            }

            // Логируем обновление
            const time = new Date().toLocaleTimeString();
            addLog(`<span class="log-tick">Тик ${data.tick}</span> <span class="log-time">${time}</span> - Индекс: ${data.index_price?.toFixed(2)}`);
        }

        function updatePrices(prices) {
            const grid = document.getElementById("priceGrid");
            grid.innerHTML = "";

            for (const [ticker, price] of Object.entries(prices)) {
                const item = document.createElement("div");
                item.className = "price-item";
                item.innerHTML = `
                    <div class="price-ticker">${ticker}</div>
                    <div class="price-value">$${price.toFixed(2)}</div>
                `;
                grid.appendChild(item);
            }
        }

        function addLog(message) {
            const log = document.getElementById("tickerLog");
            
            // Ограничиваем размер лога
            if (log.children.length > 50) {
                log.removeChild(log.firstChild);
            }

            const item = document.createElement("div");
            item.className = "log-item";
            item.innerHTML = message;
            log.appendChild(item);

            // Скроллим вниз
            log.scrollTop = log.scrollHeight;
        }

        function clearLog() {
            document.getElementById("tickerLog").innerHTML = '<div class="log-item">Лог очищен</div>';
        }

        // Автоподключение при загрузке
        window.addEventListener("load", () => {
            connectWebSocket();
        });

        // Переподключение при закрытии
        window.addEventListener("beforeunload", () => {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
