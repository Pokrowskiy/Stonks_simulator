<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Simulation Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .header {
            background: #1a1a1a;
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 13px;
            color: #ccc;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .section {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .section-header {
            padding: 15px;
            background: #f9f9f9;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            user-select: none;
        }

        .section-header:hover {
            background: #f0f0f0;
        }

        .section-header .toggle {
            font-size: 18px;
            color: #666;
            transition: transform 0.3s;
        }

        .section-header.collapsed .toggle {
            transform: rotate(-90deg);
        }

        .section-content {
            padding: 20px;
            display: none;
        }

        .section-content.visible {
            display: block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            border-left: 3px solid #1a1a1a;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a1a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-weight: 600;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 2px rgba(26, 26, 26, 0.1);
        }

        button {
            padding: 10px 20px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background: #333;
        }

        button.start {
            background: #28a745;
        }

        button.start:hover {
            background: #218838;
        }

        button.stop {
            background: #dc3545;
        }

        button.stop:hover {
            background: #c82333;
        }

        .alert {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .alert.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .alert.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .user-table-container {
            overflow-x: auto;
        }

        .chart-container {
            margin: 20px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            background: #f5f5f5;
        }

        .chart-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .chart-controls button {
            padding: 8px 15px;
            font-size: 12px;
        }

        .chart-controls button.active {
            background: #1a1a1a;
            color: white;
        }

        canvas {
            width: 100%;
            max-height: 400px;
            display: block;
        }

        .ticker-selector {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Admin Panel - Simulation Control</h1>
        <div class="status-bar">
            <span id="timeDisplay">Week: 0, Day: 0, 0:00</span>
        </div>
    </div>

    <div class="container">
        <!-- Управление симуляцией -->
        <div class="section">
            <div class="section-header" onclick="toggleSection(this)">
                <span>Simulation Control</span>
                <span class="toggle">></span>
            </div>
            <div class="section-content visible">
                <div class="form-group">
                    <label>Tick Speed (seconds)</label>
                    <div class="slider-container">
                        <input type="range" id="speedSlider" min="0.1" max="10" step="0.1" value="2" onchange="updateSpeed()">
                        <span class="slider-value" id="speedValue">0.5s</span>
                    </div>
                    <div class="form-row">
                        <button class="start" onclick="startSimulation()">Start</button>
                        <button class="stop" onclick="pauseSimulation()">Pause</button>
                        <button onclick="resetSimulation()">Reset</button>
                    </div>
                </div>
                <div id="controlAlert"></div>
            </div>
        </div>

        <!-- Графики цены -->
        <div class="section">
            <div class="section-header" onclick="toggleSection(this)">
                <span>Price Charts</span>
                <span class="toggle">></span>
            </div>
            <div class="section-content">
                <div class="ticker-selector">
                    <label>Select Ticker</label>
                    <select id="chartTicker" onchange="onChartTickerChange()">
                        <option value="GIGA">GIGA</option>
                        <option value="PWR">PWR</option>
                        <option value="BANK">BANK</option>
                        <option value="FOOD">FOOD</option>
                        <option value="PHARMA">PHARMA</option>
                    </select>
                </div>

                <div class="chart-controls">
                    <button class="active" onclick="switchChartPeriod(24)">24 Hours</button>
                    <button onclick="switchChartPeriod(168)">1 Week</button>
                    <button onclick="switchChartPeriod(1000)">Full History</button>
                </div>

                <div class="chart-container">
                    <canvas id="priceChart" width="800" height="300"></canvas>
                </div>
            </div>
        </div>

        <!-- Мониторинг пользователей -->
        <div class="section">
            <div class="section-header" onclick="toggleSection(this)">
                <span>User Monitoring</span>
                <span class="toggle">></span>
            </div>
            <div class="section-content">
                <div class="user-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Portfolio Value</th>
                                <th>Cash</th>
                                <th>UDS</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable">
                            <tr>
                                <td colspan="5" style="text-align: center; color: #999;">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Лента ликвидаций -->
        <div class="section">
            <div class="section-header" onclick="toggleSection(this)">
                <span>Liquidations Feed</span>
                <span class="toggle">></span>
            </div>
            <div class="section-content">
                <div id="liquidationsFeed" style="font-size: 13px; max-height: 400px; overflow-y: auto;">
                    <div style="color: #999;">No liquidations</div>
                </div>
            </div>
        </div>

        <!-- Управление событиями -->
        <div class="section">
            <div class="section-header" onclick="toggleSection(this)">
                <span>Event Management</span>
                <span class="toggle">></span>
            </div>
            <div class="section-content">
                <h3 style="margin-bottom: 15px; font-size: 14px;">Active Events</h3>
                <div id="eventsList" style="font-size: 13px; margin-bottom: 20px;">
                    <div style="color: #999;">No events</div>
                </div>

                <h3 style="margin-bottom: 15px; font-size: 14px;">Inject New Event</h3>
                <div class="form-group">
                    <div class="form-row">
                        <div>
                            <label>Event Name</label>
                            <input type="text" id="eventName" placeholder="e.g., Market crash">
                        </div>
                        <div>
                            <label>Event Type</label>
                            <select id="eventType" onchange="updateEventTypeFields()">
                                <option value="news">News (Volatility/Profit)</option>
                                <option value="trend">Trend (Price Direction)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- News Event Fields -->
                <div id="newsEventFields">
                    <div class="form-group">
                        <div class="form-row">
                            <div>
                                <label>Target Type</label>
                                <select id="targetType">
                                    <option value="company">Company</option>
                                    <option value="sector">Sector</option>
                                    <option value="market">Market</option>
                                </select>
                            </div>
                            <div>
                                <label>Target</label>
                                <select id="targetField">
                                    <option value="GIGA">GIGA</option>
                                    <option value="PWR">PWR</option>
                                    <option value="BANK">BANK</option>
                                    <option value="FOOD">FOOD</option>
                                    <option value="PHARMA">PHARMA</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div>
                                <label>Profit Impact</label>
                                <input type="number" id="impactProfit" value="1.0" step="0.1">
                            </div>
                            <div>
                                <label>Volatility Impact</label>
                                <input type="number" id="impactVol" value="1.0" step="0.1">
                            </div>
                            <div>
                                <label>Duration (ticks)</label>
                                <input type="number" id="eventDuration" value="24" min="1">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Trend Event Fields -->
                <div id="trendEventFields" style="display: none;">
                    <div class="form-group">
                        <div class="form-row">
                            <div>
                                <label>Target Ticker</label>
                                <select id="eventTarget">
                                    <option value="GIGA">GIGA</option>
                                    <option value="PWR">PWR</option>
                                    <option value="BANK">BANK</option>
                                    <option value="FOOD">FOOD</option>
                                    <option value="PHARMA">PHARMA</option>
                                    <option value="MARKET">Entire Market</option>
                                </select>
                            </div>
                            <div>
                                <label>Direction</label>
                                <select id="trendDirection">
                                    <option value="UP">UP</option>
                                    <option value="DOWN">DOWN</option>
                                </select>
                            </div>
                            <div>
                                <label>Strength (0.0-1.0)</label>
                                <input type="number" id="trendStrength" value="0.5" step="0.1" min="0" max="1">
                            </div>
                        </div>
                        <div class="form-row">
                            <div>
                                <label>Duration (ticks)</label>
                                <input type="number" id="eventDuration2" value="24" min="1">
                            </div>
                        </div>
                    </div>
                </div>

                <button onclick="injectEvent()">Inject Event</button>
                <div id="eventAlert"></div>
            </div>
        </div>

        <!-- Корректировка баланса -->
        <div class="section">
            <div class="section-header" onclick="toggleSection(this)">
                <span>Balance Adjustment</span>
                <span class="toggle">></span>
            </div>
            <div class="section-content">
                <div class="form-group">
                    <div class="form-row">
                        <div>
                            <label>Username</label>
                            <input type="text" id="adjustUsername" placeholder="e.g., Admin">
                        </div>
                        <div>
                            <label>Amount</label>
                            <input type="number" id="adjustAmount" value="1000" step="100">
                        </div>
                        <div style="display: flex; gap: 10px; align-items: flex-end;">
                            <button onclick="adjustBalance()">Add Balance</button>
                        </div>
                    </div>
                </div>
                <div id="adjustAlert"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8020";
        const WS_URL = "ws://localhost:8020/ws";
        
        let ws = null;
        let lastPrices = {};
        let lastPriceHistory = {};
        let currentChartPeriod = 24;
        let currentTick = 0;

        function toggleSection(header) {
            const content = header.nextElementSibling;
            header.classList.toggle("collapsed");
            content.classList.toggle("visible");
        }

        function updateTimeDisplay(tick) {
            const week = Math.floor(tick / 168);
            const dayInWeek = Math.floor((tick % 168) / 24);
            const hour = tick % 24;
            document.getElementById("timeDisplay").textContent = `Week: ${week}, Day: ${dayInWeek}, ${hour}:00`;
        }

        function onChartTickerChange() {
            const ticker = document.getElementById("chartTicker").value;
            if (ticker) {
                fetchPriceHistory(ticker).then(() => updateChart());
            }
        }

        async function updateChartData() {
            const ticker = document.getElementById("chartTicker").value;
            if (!ticker) return;
            
            try {
                const res = await fetch(`${API_BASE}/api/market/history/${ticker}?limit=1000`);
                if (!res.ok) return;
                const data = await res.json();
                lastPriceHistory[ticker] = data.history || [];
                updateChart();
            } catch (e) {
                console.error(e);
            }
        }

        function connectWebSocket() {
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                console.log("WebSocket connected");
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.tick) {
                        currentTick = data.tick;
                        updateTimeDisplay(data.tick);
                    }
                    if (data.prices) {
                        lastPrices = data.prices;
                        updateChartData();
                    }
                } catch (e) {
                    console.error("Error parsing WebSocket data:", e);
                }
            };

            ws.onerror = () => {
                console.error("WebSocket error");
            };

            ws.onclose = () => {
                setTimeout(connectWebSocket, 3000);
            };
        }

        async function updateSpeed() {
            const speed = document.getElementById("speedSlider").value;
            document.getElementById("speedValue").textContent = `${speed}s`;

            try {
                await fetch(`${API_BASE}/api/admin/speed`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ tick_duration_seconds: parseFloat(speed) })
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function startSimulation() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/start`, { method: "POST" });
                if (res.ok) {
                    showAlert("controlAlert", "Simulation started", "success");
                } else {
                    showAlert("controlAlert", "Error starting simulation", "error");
                }
            } catch (e) {
                showAlert("controlAlert", "Error starting simulation", "error");
            }
        }

        async function pauseSimulation() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/pause`, { method: "POST" });
                if (res.ok) {
                    showAlert("controlAlert", "Simulation paused", "success");
                } else {
                    showAlert("controlAlert", "Error pausing simulation", "error");
                }
            } catch (e) {
                showAlert("controlAlert", "Error pausing simulation", "error");
            }
        }

        async function resetSimulation() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/reset`, { method: "POST" });
                if (res.ok) {
                    showAlert("controlAlert", "Simulation reset", "success");
                    location.reload();
                } else {
                    showAlert("controlAlert", "Error resetting simulation", "error");
                }
            } catch (e) {
                showAlert("controlAlert", "Error resetting simulation", "error");
            }
        }

        async function updateUserMonitoring() {
            try {
                const res = await fetch(`${API_BASE}/api/broker/accounts`);
                if (!res.ok) return;
                const data = await res.json();

                const tbody = document.getElementById("usersTable");
                if (data.accounts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #999;">No accounts</td></tr>';
                    return;
                }

                tbody.innerHTML = data.accounts.map(acc => `
                    <tr>
                        <td>${acc.username}</td>
                        <td>$${acc.balances.portfolio_value_current.toFixed(2)}</td>
                        <td>$${acc.balances.cash.toFixed(2)}</td>
                        <td>${acc.uds.toFixed(2)}</td>
                        <td>${acc.uds_status}</td>
                    </tr>
                `).join("");
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchEvents() {
            try {
                const res = await fetch(`${API_BASE}/api/market/events`);
                if (!res.ok) return;
                const data = await res.json();

                const container = document.getElementById("eventsList");
                if (data.events.length === 0) {
                    container.innerHTML = '<div style="color: #999;">No events</div>';
                } else {
                    container.innerHTML = data.events.map(e => 
                        `<div style="padding: 8px; background: #f5f5f5; border-radius: 3px; margin-bottom: 8px;">
                            ${e.name}
                        </div>`
                    ).join("");
                }
            } catch (e) {
                console.error(e);
            }
        }

        function updateEventTypeFields() {
            const type = document.getElementById("eventType").value;
            
            if (type === "trend") {
                document.getElementById("newsEventFields").style.display = "none";
                document.getElementById("trendEventFields").style.display = "block";
            } else {
                document.getElementById("newsEventFields").style.display = "block";
                document.getElementById("trendEventFields").style.display = "none";
            }
        }

        async function injectEvent() {
            const name = document.getElementById("eventName").value;
            const eventType = document.getElementById("eventType").value;
            
            if (!name) {
                showAlert("eventAlert", "Fill required fields", "error");
                return;
            }

            let payload;
            
            if (eventType === "trend") {
                const target = document.getElementById("eventTarget").value;
                const direction = document.getElementById("trendDirection").value;
                const strength = parseFloat(document.getElementById("trendStrength").value);
                const duration = parseInt(document.getElementById("eventDuration2").value);
                
                payload = {
                    name, target_type: "trend", target,
                    trend_direction: direction,
                    impact_profit: strength,
                    duration_ticks: duration
                };
            } else {
                const targetType = document.getElementById("targetType").value;
                const target = document.getElementById("targetField").value;
                const impactProfit = parseFloat(document.getElementById("impactProfit").value);
                const impactVol = parseFloat(document.getElementById("impactVol").value);
                const duration = parseInt(document.getElementById("eventDuration").value);
                
                payload = {
                    name, target_type: targetType, target,
                    impact_profit: impactProfit, impact_volatility: impactVol,
                    duration_ticks: duration
                };
            }

            try {
                const res = await fetch(`${API_BASE}/api/admin/inject-event`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showAlert("eventAlert", "Event injected", "success");
                    document.getElementById("eventName").value = "";
                    fetchEvents();
                } else {
                    showAlert("eventAlert", "Error injecting event", "error");
                }
            } catch (e) {
                showAlert("eventAlert", "Error injecting event", "error");
            }
        }

        async function adjustBalance() {
            const username = document.getElementById("adjustUsername").value;
            const amount = parseFloat(document.getElementById("adjustAmount").value);

            if (!username) {
                showAlert("adjustAlert", "Enter username", "error");
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/admin/adjust-balance`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, amount })
                });

                if (res.ok) {
                    showAlert("adjustAlert", "Balance adjusted", "success");
                    updateUserMonitoring();
                } else {
                    showAlert("adjustAlert", "Error adjusting balance", "error");
                }
            } catch (e) {
                showAlert("adjustAlert", "Error adjusting balance", "error");
            }
        }

        function switchChartPeriod(period) {
            currentChartPeriod = period;
            
            document.querySelectorAll('.chart-controls button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            updateChart();
        }

        async function updateChart() {
            const ticker = document.getElementById("chartTicker").value;
            if (!ticker) return;

            let history = lastPriceHistory[ticker];
            
            if (!history || history.length === 0) {
                return;
            }

            let data = history;

            if (currentChartPeriod === 24) {
                data = history.slice(-24);
            } else if (currentChartPeriod === 168) {
                data = history.slice(-168);
            } else if (currentChartPeriod === 1000) {
                data = history.slice(-1000);
                data = data.filter((_, i) => i % 24 === 0);
            }

            drawChart(data);
        }

        async function fetchPriceHistory(ticker) {
            try {
                const res = await fetch(`${API_BASE}/api/market/history/${ticker}?limit=1000`);
                if (!res.ok) return [];
                const data = await res.json();
                lastPriceHistory[ticker] = data.history || [];
                return data.history || [];
            } catch (e) {
                console.error(e);
                return [];
            }
        }

        function drawChart(data) {
            const canvas = document.getElementById("priceChart");
            const ctx = canvas.getContext('2d');
            
            if (!data || data.length < 2) return;

            const width = canvas.width;
            const height = canvas.height;
            const padding = 50;
            
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, width, height);

            const prices = data.map(p => typeof p === 'object' ? p.price : p);
            const minPrice = Math.min(...prices);
            const maxPrice = Math.max(...prices);
            const priceRange = maxPrice - minPrice || 1;

            const priceToY = (price) => {
                return height - padding - ((price - minPrice) / priceRange) * (height - padding * 2);
            };

            const xStep = (width - padding * 2) / (data.length - 1);

            for (let i = 0; i < data.length - 1; i++) {
                const x = padding + i * xStep;
                const price = prices[i];
                const nextPrice = prices[i + 1];
                const y = priceToY(price);
                const nextY = priceToY(nextPrice);
                
                const rectWidth = xStep;
                
                if (nextPrice > price) {
                    ctx.fillStyle = 'rgba(40, 167, 69, 0.2)';
                } else {
                    ctx.fillStyle = 'rgba(220, 53, 69, 0.2)';
                }
                
                ctx.fillRect(x, Math.min(y, nextY), rectWidth, Math.abs(nextY - y) || 1);
            }

            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            for (let i = 0; i < data.length; i++) {
                const x = padding + i * xStep;
                const price = prices[i];
                const y = priceToY(price);
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();

            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padding, padding);
            ctx.lineTo(padding, height - padding);
            ctx.lineTo(width - padding, height - padding);
            ctx.stroke();

            ctx.fillStyle = '#666';
            ctx.font = '12px Arial';
            ctx.textAlign = 'right';
            
            ctx.fillText(maxPrice.toFixed(2), padding - 10, padding + 5);
            ctx.fillText(minPrice.toFixed(2), padding - 10, height - padding + 5);
        }

        function showAlert(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.innerHTML = `<div class="alert ${type}">${message}</div>`;
            setTimeout(() => {
                el.innerHTML = "";
            }, 5000);
        }

        connectWebSocket();
        updateUserMonitoring();
        fetchEvents();
        fetchPriceHistory('GIGA').then(() => updateChart());

        setInterval(updateUserMonitoring, 3000);
        setInterval(fetchEvents, 5000);
    </script>
</body>
</html>
